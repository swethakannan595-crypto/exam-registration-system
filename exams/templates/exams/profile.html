{% extends "exams/base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1>Profile</h1>
<div class="card narrow">
  <dl class="two">
    <dt>Name</dt><dd>{{ user.get_full_name|default:user.username }}</dd>
    <dt>Email</dt><dd>{{ user.email }}</dd>
    <dt>Roll number</dt><dd>{{ prof.roll_no }}</dd>
  </dl>
  <form method="post">{% csrf_token %}
    {% for f in form %}<label>{{ f.label }} {{ f }}</label>{% endfor %}
    <button class="btn">Save changes</button>
  </form>
</div>
{% endblock %}
